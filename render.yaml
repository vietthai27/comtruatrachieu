# Render Blueprint cho frontend (static site). Trên Render: New + -> Blueprint -> chọn repo này.
# FE gọi thẳng backend https://comtruatrachieu-api.fly.dev (VITE_API_URL trong .env.production);
# backend đã mở CORS (APP_CORS_ALLOWED_ORIGINS mặc định "*").
services:
  - type: web
    name: comtruatrachieu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # file trong assets/ có hash trong tên -> cache lâu được
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html luôn lấy bản mới để nhận bản build mới
      - path: /index.html
        name: Cache-Control
        value: no-cache
